<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamCall Co-Pilot - Callsense</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;display:flex;justify-content:center;min-height:100vh}
.container{max-width:450px;width:100%;padding:20px;text-align:center}
h1{font-size:32px;margin-bottom:5px}.sub{color:#94a3b8;margin-bottom:30px}
.card{background:#1e293b;padding:25px;border-radius:20px;margin:20px 0}
.btn{background:#3b82f6;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:18px;cursor:pointer;width:100%;margin-top:15px}
.mic{width:110px;height:110px;background:#1e293b;border:4px solid #334155;border-radius:50%;font-size:50px;display:flex;align-items:center;justify-content:center;margin:25px auto;cursor:pointer}
.mic.live{border-color:#ef4444;animation:pulse 1s infinite} @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.box{background:#1e293b;padding:15px;border-radius:12px;min-height:80px;text-align:left;margin-top:15px}
.hidden{display:none}
</style>
</head>
<body>
<div class="container" id="homePage">
<h1>🛡️ ScamCall Co-Pilot</h1><p class="sub">Callsense - Your AI Call Guardian</p>
<div class="card"><h2>Protect your family from scam calls</h2><p style="color:#94a3b8">AI listens, detects, and warns before you lose money</p>
<button class="btn" onclick="showProtect()">Start Protection →</button></div>
<p style="color:#64748b;font-size:12px">Member 1 - Landing + Protection Page</p>
</div>

<div class="container hidden" id="protectPage">
<button onclick="showHome()" style="background:none;color:#94a3b8;border:none;cursor:pointer;text-align:left;width:100%">← Home</button>
<h2>🎤 Live Protection</h2>
<div class="mic" id="micBtn" onclick="toggleMic()">🎤</div>
<p id="micStatus">Tap mic to start</p>
<div class="box"><b>Live Transcript:</b><p id="transcript">Waiting for call...</p></div>
<div class="box" id="riskBox" style="display:none"><b id="riskText"></b><p id="tacticText"></p></div>
</div>

<script>
function showProtect(){document.getElementById('homePage').classList.add('hidden');document.getElementById('protectPage').classList.remove('hidden')}
function showHome(){document.getElementById('protectPage').classList.add('hidden');document.getElementById('homePage').classList.remove('hidden')}
let listening=false, recognition;
function toggleMic(){
  if(!listening){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){alert('Please open in Chrome'); return;}
    recognition = new SR(); recognition.continuous=true; recognition.interimResults=true;
    recognition.onresult=(e)=>{const t=Array.from(e.results).map(r=>r[0].transcript).join('');document.getElementById('transcript').innerText=t; detectScam(t)};
    recognition.start(); listening=true;
    document.getElementById('micBtn').classList.add('live'); document.getElementById('micBtn').innerText='🔴'; document.getElementById('micStatus').innerText='Listening... Say "bank account blocked transfer money"';
  } else { recognition.stop(); listening=false; document.getElementById('micBtn').classList.remove('live'); document.getElementById('micBtn').innerText='🎤'; document.getElementById('micStatus').innerText='Tap mic to start'; }
}
function detectScam(text){
  const t=text.toLowerCase(); let score=0, tactics=[];
  if(t.includes('bank')||t.includes('police')||t.includes('rbi')){score+=30; tactics.push('Fake Authority')}
  if(t.includes('block')||t.includes('urgent')||t.includes('immediately')){score+=25; tactics.push('Urgency')}
  if(t.includes('money')||t.includes('transfer')||t.includes('pay')){score+=25; tactics.push('Money Request')}
  if(t.includes('otp')||t.includes('password')){score+=30; tactics.push('OTP Request')}
  if(score>0){const risk=score>70?'HIGH':score>40?'MEDIUM':'LOW'; document.getElementById('riskBox').style.display='block'; document.getElementById('riskBox').style.background= risk=='HIGH'?'#7f1d1d': risk=='MEDIUM'?'#78350f':'#14532d'; document.getElementById('riskText').innerText=`${risk=='HIGH'?'🔴':'🟡'} ${risk} RISK - Score ${score}%`; document.getElementById('tacticText').innerText=`Detected: ${tactics.join(', ')}`}
}
</script>
</body>
</html>
